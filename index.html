<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />

    <meta
      name="description"
      content="Welcome to MentorHub. Discover expert mentors, explore available time slots, book mentoring sessions, and manage your bookings in one place."

    <!-- WhatsApp, Facebook and LinkedIn preview -->
    <meta property="og:type" content="website" />

      property="og:title"
      content="MentorHub | Mentor Booking System"

      property="og:url"
      content="https://YOUR-FRONTEND-DOMAIN/"
